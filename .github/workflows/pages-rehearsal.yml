# 公開物を「保護された場所」で組み立てるための下ごしらえ（移行手順5）
#
# ★いまは公開の切り替えをしない★
#   Pages の Source は触らない。ここでやるのは
#   「main の中身から、公開してよい物だけを空のフォルダに組み立て直せるか」の予行演習。
#   公開できる機種が 0 のうちは build が失敗するのが正しい結果（＝安全側）。
#
#   deploy は手動起動 かつ リポジトリ変数 PAGES_DEPLOY_ENABLED=true が無い限り動かない。
#   Actions はタグではなく完全なコミットSHAに固定する（タグは後から差し替えられるため）。
#
# ★リポジトリ設定でやらないと効かないこと（コードだけでは塞げない・Codex 14巡目 (a)-6）★
#   1. 必須チェックは **release-gate** にする。`build` を必須にすると、
#      条件でskipされた時にGitHubが「成功」と見なしてmergeを止めない。
#   2. main で「Require review from Code Owners」を有効にする
#      （CODEOWNERS は置くだけでは merge を止めない）。
#   3. 管理者・ruleset の bypass を制限する。
#   4. それでも「所有者自身が意図的に回避する」ことは技術的に防げない
#      （別アカウントのレビュアーか、制限したGitHub Appが要る）。
#   5. PRはworkflow自身も書き換えられる。外部フォークは下の if で走らせないが、
#      **PR由来の緑を信用してmergeしない**という運用が最後の砦。

name: pages-rehearsal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-verified-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # ★deploy 側からゲート状態を見られるようにする★
    #   ゲートが無効なら成果物そのものが存在しないので、deploy は絶対に走らせない。
    outputs:
      gate_on: ${{ steps.gate.outputs.on }}

    # ★フォークからのPRでは走らせない★（2026-07-30・Codex 13巡目 (a)-4）
    #   pull_request はPR側のコードを実行する。つまりPRで
    #   検査スクリプトやこのworkflow自体を「常に合格」に書き換えれば、
    #   release-gate は緑になる。緑を信じてmergeすると後で公開されてしまう。
    #   検査は「信頼した場所のコード」で走らせる必要があるので、外部PRは対象外にする。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"

      - name: Prepare log key
        shell: bash
        run: |
          # ★このジョブ限りの鍵★（Codex 20巡目 (b)-3）
          #   公開されるログでは原文を伏せ、代わりにこの鍵で作った指紋を出す。
          #   ジョブ内の全スクリプトで共有するので「同じ文字列か」は突き合わせられ、
          #   ジョブが終われば鍵は消えるので後から言い当てられない。
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"      # 万一どこかで出力されても伏せる
          echo "UCHIDOKORO_LOG_KEY=$key" >> "$GITHUB_ENV"

      - name: Self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/claim_evidence.py --selftest
          python scripts/claim_ledger.py --selftest
          python scripts/claim_c5.py --selftest
          python scripts/claim_inventory.py --selftest
          python scripts/claim_reconcile.py --selftest
          python scripts/extract_setting_rates.py --selftest
          python scripts/build_public_data.py --selftest
          python scripts/gates.py --selftest
          python scripts/audit_public.py --selftest
          python scripts/build_pages_artifact.py --selftest
          python scripts/build_hub_pages.py --selftest
          # ★今日足したものもCIで見る★（手元だけで確かめない）
          python scripts/numerals.py --selftest
          python scripts/safe_json.py --selftest
          python scripts/claim_pipeline.py --selftest
          python scripts/claim_collect.py --selftest
          python scripts/task_guard.py --selftest
          # ★新台追加タスクの部品★（ネットに出ない試験だけ）
          python scripts/html_tables.py --selftest
          python scripts/cz_lookup.py --selftest
          python scripts/at_spec_lookup.py --selftest
          python scripts/ceiling_lookup.py --selftest
          python scripts/spec_lookup.py --selftest
          python scripts/lineage_check.py --selftest
          python scripts/model_code_lookup.py --selftest
          python scripts/directory_index.py --selftest
          python scripts/build_new_article.py --selftest
          python scripts/new_machine_watch.py --selftest
          python scripts/pending_machines.py --selftest
          python scripts/html_check.py
          python scripts/publish_new_machine.py --selftest
          python scripts/prepush_gate.py --selftest
          python scripts/check_duplicate.py --name "存在しない機種テスト用XYZ"

      - name: Repository audits
        shell: bash
        run: |
          # ★片方が落ちても両方走らせて、まとめて結果を出す★（Codex 17巡目 (b)-2）
          #   set -e だと先に落ちた時点で残りが実行されず、直すべき点が1回で分からない。
          set -uo pipefail
          rc=0
          # 引数なしの gates.py は説明を出すだけなので実データ検査は crosscheck が担当（16巡目 (b)-2）
          python scripts/crosscheck_gates.py > cc.log 2>&1 || rc=1
          python scripts/audit_site.py > as.log 2>&1 || rc=1
          cat cc.log as.log
          # ★落ちた内容を実行ページに残す★（2026-07-30）
          #   ログはリポジトリの権限が無いと読めず、失敗メールには
          #   「exit code 1」しか出ない。手元で再現できない失敗（Linux特有など）を
          #   追えるように、要約欄へ出しておく。要約欄は実行ページで誰でも読める。
          if [ "$rc" -ne 0 ]; then
            {
              echo "## Repository audits が失敗しました"
              echo '### crosscheck_gates'
              echo '```'
              tail -n 30 cc.log
              echo '```'
              echo '### audit_site'
              echo '```'
              tail -n 40 as.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # ★注釈にも出す★（2026-07-30）
            #   要約欄は実行ページを開かないと読めない。注釈はAPIからも読めるので、
            #   ここに出しておくと「手元で再現できない失敗」を外から追える。
            echo "::error title=crosscheck::$(tail -n 6 cc.log | tr '\n' ' ')"
            echo "::error title=audit_site::$(tail -n 8 as.log | tr '\n' ' ')"
          fi
          exit "$rc"

      # ★公開物を作る段に入ってよいかを、実ファイルだけで決める★
      #   （2026-07-30）ゲートが無効のうちは公開できる機種が0なので、
      #   ビルドは必ず失敗する。それを「赤いまま」放置すると、
      #   **本物の失敗に気づけなくなる**（赤が常態＝赤を見なくなる）。
      #   ここで無効を検出したら、以降の公開系ステップを飛ばして緑で終える。
      #   ★設定が読めない・bool以外・壊れている場合は落とす（fail-closed）★
      #     ＝「読めなかったから飛ばす」は絶対にしない。
      - name: Check the publish gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          on="$(python -c 'import sys; sys.path.insert(0, "scripts"); from build_public_data import claim_gate_enabled; print("true" if claim_gate_enabled() else "false")')"
          echo "on=${on}" >> "$GITHUB_OUTPUT"
          echo "publish gate: ${on}"

      - name: Nothing to publish yet
        if: steps.gate.outputs.on != 'true'
        shell: bash
        run: |
          echo "::notice title=公開ゲートは無効です::\
          検査は全て実行しました。公開できる機種がまだ無いので、公開物は作りません。\
          有効にする前に _design/phase1_open_holes.md の項目を解消してください。"

      - name: Build from an empty artifact directory
        if: steps.gate.outputs.on == 'true'
        shell: bash
        env:
          # ★公開スイッチが入っている時は、外部依存の残件があるとビルドを落とす★
          #   （Codex 18巡目 (a)-4：Google Fonts / gtag は指紋の外）
          PAGES_DEPLOY_ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          python scripts/build_pages_artifact.py

      - name: Audit the artifact independently
        if: steps.gate.outputs.on == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_public.py \
            --file _site/assets/data/machines.json \
            --details-dir _site/assets/data/machine-details

      - name: Verify deterministic content hash
        if: steps.gate.outputs.on == 'true'
        shell: bash
        run: |
          set -euo pipefail
          first="$(python -c \
            'import json; print(json.load(open("_site/artifact-manifest.json", encoding="utf-8"))["content_sha256"])')"
          rm -rf _site
          python scripts/build_pages_artifact.py
          second="$(python -c \
            'import json; print(json.load(open("_site/artifact-manifest.json", encoding="utf-8"))["content_sha256"])')"
          test "$first" = "$second"

      - name: Upload Pages artifact
        if: steps.gate.outputs.on == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  release-gate:
    name: release-gate
    needs:
      - build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful verified build
        shell: bash
        run: |
          test "${{ needs.build.result }}" = "success"

  deploy:
    name: deploy-pages
    needs:
      - build
      - release-gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true &&
      github.ref == 'refs/heads/main' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      needs.build.outputs.gate_on == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
