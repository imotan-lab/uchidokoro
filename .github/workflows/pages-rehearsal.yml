# 自己試験と監査をCIで回す（名前は昔の「公開物の予行演習」の名残）
#
# ★公開物の組み立て・配信はここではしない★（2026-10-01）
#   Phase 1 の公開ゲート（claim-gate）は一度も有効にされないまま撤去した。
#   ゲートが有効なときだけ動いていた「空のフォルダから公開物を組み立てる段」
#   ・成果物の独立監査・指紋の再現確認・成果物のアップロード・deploy ジョブも
#   一緒に外した。配信は publish-pages.yml だけが行う。
#
#   Actions はタグではなく完全なコミットSHAに固定する（タグは後から差し替えられるため）。
#
# ★リポジトリ設定でやらないと効かないこと（コードだけでは塞げない・Codex 14巡目 (a)-6）★
#   1. 必須チェックは **release-gate** にする。`build` を必須にすると、
#      条件でskipされた時にGitHubが「成功」と見なしてmergeを止めない。
#   2. main で「Require review from Code Owners」を有効にする
#      （CODEOWNERS は置くだけでは merge を止めない）。
#   3. 管理者・ruleset の bypass を制限する。
#   4. それでも「所有者自身が意図的に回避する」ことは技術的に防げない
#      （別アカウントのレビュアーか、制限したGitHub Appが要る）。
#   5. PRはworkflow自身も書き換えられる。外部フォークは下の if で走らせないが、
#      **PR由来の緑を信用してmergeしない**という運用が最後の砦。

name: pages-rehearsal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-verified-artifact
    runs-on: ubuntu-24.04
    # ★これは「止まって動かなくなった時に気づく」ための非常ベル★
    #   （2026-09-08・運営者の承認で 20→40 分・台帳#591）
    #   ★20分では役に立っていなかった★＝直近20回のうち7回(35%)が、
    #   止まったからではなく普通に働いている最中に切られていた
    #   （成功した13回も14〜21分で、線に張り付いていた）。
    #   ＝「止まっている」と「忙しい」を区別できない状態だった。
    #   ★外さない理由★＝外すとGitHubの初期値(360分)になる。
    #   2026-09-07に死んだ相手を2時間50分待つ事故を実際に起こしている(罠㊼)。
    #   ★次にやること★＝どの工程に何分かかっているかを測る
    #   （測らずに分割や高速化へ進むと当てずっぽうになる）。
    timeout-minutes: 40

    # ★フォークからのPRでは走らせない★（2026-07-30・Codex 13巡目 (a)-4）
    #   pull_request はPR側のコードを実行する。つまりPRで
    #   検査スクリプトやこのworkflow自体を「常に合格」に書き換えれば、
    #   release-gate は緑になる。緑を信じてmergeすると後で公開されてしまう。
    #   検査は「信頼した場所のコード」で走らせる必要があるので、外部PRは対象外にする。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"

      - name: Prepare log key
        shell: bash
        run: |
          # ★このジョブ限りの鍵★（Codex 20巡目 (b)-3）
          #   公開されるログでは原文を伏せ、代わりにこの鍵で作った指紋を出す。
          #   ジョブ内の全スクリプトで共有するので「同じ文字列か」は突き合わせられ、
          #   ジョブが終われば鍵は消えるので後から言い当てられない。
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"      # 万一どこかで出力されても伏せる
          echo "UCHIDOKORO_LOG_KEY=$key" >> "$GITHUB_ENV"

      - name: Self-tests
        shell: bash
        run: |
          set -euo pipefail
          # ★★どの検査が落ちたかを必ず残す★★（2026-08-22）
          #   ★これが無くて困ったこと★＝失敗しても実行ページに出るのは
          #   「Process completed with exit code 1」だけで、
          #   ★どのスクリプトが落ちたのか分からない★。
          #   ログ本体はリポジトリの権限が無いと読めない（APIは403）。
          #   手元（Windows）で再現できない失敗のときは、これだと手掛かりが無い。
          #   ★ERRトラップで、落ちたコマンドそのものを注記として出す★
          #   （ci_repro は「python で始まる行」を読むので、この行は影響しない）
          trap 'echo "::error title=Self-tests::★落ちた検査: ${BASH_COMMAND}★"' ERR
          python scripts/claim_evidence.py --selftest
          python scripts/claim_ledger.py --selftest
          python scripts/claim_c5.py --selftest
          python scripts/claim_inventory.py --selftest
          python scripts/claim_reconcile.py --selftest
          python scripts/extract_setting_rates.py --selftest
          # ★判定書と緊急スイッチ★（2026-08-26）
          #   ★どちらもCIで一度も動いていなかった★＝
          #   公開するか・検索に載せるかを決める中心なのに、
          #   手元で流したときしか確かめていなかった。
          python scripts/page_decision.py --selftest
          python scripts/apply_indexing_policy.py --selftest
          python scripts/gates.py --selftest
          python scripts/audit_public.py --selftest
          python scripts/build_pages_artifact.py --selftest
          python scripts/build_hub_pages.py --selftest
          # ★監査そのものの対照実験★（2026-09-01・Codexのレビュー30）
          #   ★これが無いと、監査に足した見張り（37・39・51〜54）が
          #   CIで一度も試されない★
          python scripts/audit_site.py --selftest
          # ★★控えを初回として作る★★（2026-08-24）
          #   ★CIの機械には確定値の控えが無い★＝
          #   「無ければ止まる」に変えた日に、CIが2回続けて赤くなった。
          #   ★初回と「消えた」を区別する★方針どおり、明示的に作る。
          python scripts/confirmed_values.py --init --if-missing
          # ★今日足したものもCIで見る★（手元だけで確かめない）
          python scripts/numerals.py --selftest
          python scripts/safe_json.py --selftest
          python scripts/claim_pipeline.py --selftest
          python scripts/claim_collect.py --selftest
          python scripts/task_guard.py --selftest
          # ★新台追加タスクの部品★（ネットに出ない試験だけ）
          python scripts/html_tables.py --selftest
          python scripts/cz_lookup.py --selftest
          python scripts/at_spec_lookup.py --selftest
          python scripts/ceiling_lookup.py --selftest
          python scripts/spec_lookup.py --selftest
          python scripts/lineage_check.py --selftest
          python scripts/model_code_lookup.py --selftest
          python scripts/directory_index.py --selftest
          # ★材料の採否の契約★（2026-08-17・Codex依頼237の厚み3）
          #   add_machine_run の回帰試験はCIで動いていたが、
          #   控えの契約そのもの（64件）はCIに載っていなかった。
          python scripts/maker_identity_cache.py --selftest
          python scripts/material_contract.py --selftest
          python scripts/material_contract.py --check
          python scripts/build_new_article.py --selftest
          python scripts/new_machine_watch.py --selftest
          python scripts/pending_machines.py --selftest
          python scripts/html_check.py
          python scripts/publish_new_machine.py --selftest
          python scripts/prepush_gate.py --selftest
          python scripts/add_machine_health.py --selftest
          # ★新台の入口（DMMぱちタウン一本）★（2026-08-16・台帳#376）
          #   ここが一覧に無いと、同じ壊れ方をしてもCIは緑のまま通る。
          #   ★automation_policy は「規約を確かめずに巡回先を足す」ことの関所★
          python scripts/dmm_calendar.py --selftest
          python scripts/dmm_machine.py --selftest
          python scripts/dmm_discover.py --selftest
          python scripts/slug_binding.py --selftest
          python scripts/automation_policy.py --selftest
          python scripts/grow_machine.py --selftest
          python scripts/add_machine_run.py --selftest
          python scripts/text_args.py --selftest
          python scripts/owner_questions.py --selftest
          python scripts/confirmed_values.py --selftest
          # ★台帳を閉じる側も直接まわす★（2026-09-17）
          #   ★直す前★＝この2本はCIの名簿に無く、壊し方の道具が
          #   「壊す前が緑か」を測るときにだけ動いていた。
          #   ＝ここが赤いとき「壊す前から赤い」としか出ず、
          #   ★何が壊れたのかが名指しで出なかった★。
          python scripts/recheck.py --selftest
          # ★表示検査を、確かに自分のサーバーで行う道具★（台帳#493）
          #   控えたPIDと実際にポートを掴む番号が別物で、
          #   ★過去の残骸が検査に応答していた★（最古は5日間動きっぱなし）
          python scripts/render_check.py --selftest
          python scripts/pre_push_check.py --selftest
          # ★置き場が無い環境でも通ることを確かめてから足すこと★（台帳 #336）
          #   2026-08-12に「Windows専用の置き場が原因」と決めつけて外したが、
          #   本当の原因は grow_machine の samefile() だった。
          #   この4本は、置き場を存在しない場所へ向けても通ることを確認済み。
          python scripts/check_duplicate.py --name "存在しない機種テスト用XYZ"
          # ★守りをわざと壊して、試験が赤くなるか確かめる★（2026-08-24）
          #   ★試験が通ること自体は「守りが効いている」証拠にならない★＝
          #   実際、根拠の保存を消しても全部緑のままだった時期がある。
          #   時間のかかる1件は --fast で外す（飛ばしたことは出力に出る）。
          python scripts/mutation_check.py --fast

      - name: Repository audits
        shell: bash
        run: |
          # ★片方が落ちても両方走らせて、まとめて結果を出す★（Codex 17巡目 (b)-2）
          #   set -e だと先に落ちた時点で残りが実行されず、直すべき点が1回で分からない。
          set -uo pipefail
          rc=0
          # 引数なしの gates.py は説明を出すだけなので実データ検査は crosscheck が担当（16巡目 (b)-2）
          python scripts/crosscheck_gates.py > cc.log 2>&1 || rc=1
          python scripts/audit_site.py > as.log 2>&1 || rc=1
          cat cc.log as.log
          # ★落ちた内容を実行ページに残す★（2026-07-30）
          #   ログはリポジトリの権限が無いと読めず、失敗メールには
          #   「exit code 1」しか出ない。手元で再現できない失敗（Linux特有など）を
          #   追えるように、要約欄へ出しておく。要約欄は実行ページで誰でも読める。
          if [ "$rc" -ne 0 ]; then
            {
              echo "## Repository audits が失敗しました"
              echo '### crosscheck_gates'
              echo '```'
              tail -n 30 cc.log
              echo '```'
              echo '### audit_site'
              echo '```'
              tail -n 40 as.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # ★注釈にも出す★（2026-07-30）
            #   要約欄は実行ページを開かないと読めない。注釈はAPIからも読めるので、
            #   ここに出しておくと「手元で再現できない失敗」を外から追える。
            echo "::error title=crosscheck::$(tail -n 6 cc.log | tr '\n' ' ')"
            echo "::error title=audit_site::$(tail -n 8 as.log | tr '\n' ' ')"
          fi
          exit "$rc"

  release-gate:
    name: release-gate
    needs:
      - build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful verified build
        shell: bash
        run: |
          test "${{ needs.build.result }}" = "success"
